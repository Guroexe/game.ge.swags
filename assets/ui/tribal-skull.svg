<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 96">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8f2"/>
      <stop offset="0.42" stop-color="#8e8ea2"/>
      <stop offset="0.58" stop-color="#42424e"/>
      <stop offset="1" stop-color="#b2b2c6"/>
    </linearGradient>
    <linearGradient id="metalDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9aac"/>
      <stop offset="0.5" stop-color="#4c4c5a"/>
      <stop offset="1" stop-color="#7c7c90"/>
    </linearGradient>
  </defs>

  <!-- биомеханический «позвоночник»: ребристая ось через всю композицию -->
  <path d="M36 48 H604" stroke="url(#metalDim)" stroke-width="3.5" stroke-dasharray="7 9" fill="none"/>
  <path d="M36 48 H604" stroke="#07070c" stroke-width="0.8" fill="none" opacity="0.7"/>

  <!-- трибал-клинки (левая сторона) -->
  <g fill="url(#metal)" stroke="#07070c" stroke-width="1.4" stroke-linejoin="round">
    <path d="M298 44 C252 26 204 20 148 4 C186 34 236 50 300 52 Z"/>
    <path d="M298 56 C246 58 196 70 142 62 C188 84 248 72 300 62 Z"/>
    <path d="M300 38 C268 16 244 8 214 2 C240 24 268 38 300 46 Z"/>
    <!-- шипы -->
    <path d="M236 66 L226 84 L246 68 Z"/>
    <path d="M196 30 L182 14 L204 34 Z"/>
    <path d="M120 54 L100 46 L124 62 Z"/>
  </g>
  <!-- трибал-клинки (правая сторона, зеркало) -->
  <g transform="translate(640,0) scale(-1,1)" fill="url(#metal)" stroke="#07070c" stroke-width="1.4" stroke-linejoin="round">
    <path d="M298 44 C252 26 204 20 148 4 C186 34 236 50 300 52 Z"/>
    <path d="M298 56 C246 58 196 70 142 62 C188 84 248 72 300 62 Z"/>
    <path d="M300 38 C268 16 244 8 214 2 C240 24 268 38 300 46 Z"/>
    <path d="M236 66 L226 84 L246 68 Z"/>
    <path d="M196 30 L182 14 L204 34 Z"/>
    <path d="M120 54 L100 46 L124 62 Z"/>
  </g>

  <!-- центральный череп -->
  <g transform="translate(320,44)">
    <!-- рога -->
    <g fill="url(#metal)" stroke="#07070c" stroke-width="1.4" stroke-linejoin="round">
      <path d="M-20 -12 C-32 -26 -44 -30 -58 -26 C-46 -20 -38 -12 -34 0 C-30 -6 -26 -10 -20 -12 Z"/>
      <path d="M20 -12 C32 -26 44 -30 58 -26 C46 -20 38 -12 34 0 C30 -6 26 -10 20 -12 Z"/>
      <!-- подбородочный шип -->
      <path d="M-4 30 L0 48 L4 30 Z"/>
      <!-- боковые клыки-иглы -->
      <path d="M-30 8 L-42 14 L-29 16 Z"/>
      <path d="M30 8 L42 14 L29 16 Z"/>
    </g>
    <!-- черепная коробка + челюсть -->
    <path d="M0 -24 C-20 -24 -28 -10 -28 2 C-28 12 -23 18 -17 21 L-17 32 L-8 32 L-8 26 L-3 26 L-3 32 L3 32 L3 26 L8 26 L8 32 L17 32 L17 21 C23 18 28 12 28 2 C28 -10 20 -24 0 -24 Z"
          fill="url(#metal)" stroke="#07070c" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- глазницы (светящиеся) -->
    <path d="M-17 -3 L-6 -7 L-3 3 L-15 5 Z" fill="#ff2d55"/>
    <path d="M17 -3 L6 -7 L3 3 L15 5 Z" fill="#ff2d55"/>
    <!-- нос -->
    <path d="M0 7 L-3.5 15 L3.5 15 Z" fill="#0a0a10"/>
    <!-- трещина-трибал на лбу -->
    <path d="M0 -24 L-3 -14 L2 -10 L-2 -4" fill="none" stroke="#2a0a14" stroke-width="1.6"/>
  </g>
</svg>
